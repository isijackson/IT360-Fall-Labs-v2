# Replace the IPs with your client VM public IPs. Keep ansible_user matching the
# login user you created on each VM (ubuntu on Azure/GCP Ubuntu images).
[azure]
20.163.12.90 ansible_user=ubuntu

[gcp]
34.x.x.x ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
